<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMJS Tour Manager</title><?!= include('Style'); ?></head><body>
<div id="authScreen" class="authScreen"><div class="authCard"><div class="authLogo">GMJS</div><small>PRIVATE ADMIN PANEL</small><h1>Tour Manager</h1><p>Enter your Admin PIN to continue.</p><form onsubmit="login(event)"><input id="pinInput" class="pinInput" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="Admin PIN" required><button class="primary authBtn">Unlock Dashboard</button></form><div id="loginError" class="loginError"></div></div></div>
<div id="appShell" class="hidden"><header class="top"><div><small>GMJS TOUR MANAGER</small><h1 id="tourTitle">Loading…</h1><p id="tourDates"></p></div><div class="topActions"><button class="refresh" onclick="load()">↻</button><button class="logout" onclick="doLogout()">Logout</button></div></header><main>
<section id="stats" class="stats"></section><section class="card"><div class="sectionHead"><div><small>SEAT BOOKING</small><h2>Bus Seats</h2></div><select id="busSelect" onchange="renderBus()"></select></div><div class="legend"><span>🟢 Available</span><span>🔴 Booked</span><span>🟠 Payment Due</span></div><div id="seatMap" class="seatMap"></div></section>

<section id="roomSection"></section><section id="paymentSection"></section><section id="financeSection"></section>
</main><nav class="nav"><button onclick="topPage()">⌂<span>Dashboard</span></button><button onclick="seatPage()">▦<span>Seats</span></button><button onclick="document.getElementById('search').focus()">♙<span>Passengers</span></button><button onclick="document.getElementById('paymentSection').scrollIntoView({behavior:'smooth'})">৳<span>Payments</span></button><button onclick="document.getElementById('roomSection').scrollIntoView({behavior:'smooth'})">⌂<span>Rooms</span></button><button onclick="document.getElementById('financeSection').scrollIntoView({behavior:'smooth'})">▤<span>Finance</span></button></nav>
