name: Auto Sync to Contabo Server

# main ব্রাঞ্চে কোড পুশ (Push) হলেই এই অ্যাকশনটি চালু হবে
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # ১. গিটহাব থেকে লেটেস্ট কোড চেকআউট করা
    - name: Checkout Repository Code
      uses: actions/checkout@v5

    # ২. আপনার কন্টাবো সার্ভারে ssh-action এর মাধ্যমে ফাইল সিঙ্ক করা
    - name: Deploy to Contabo via SSH/Rsync
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.CONTABO_HOST }}
        username: ${{ secrets.CONTABO_USERNAME }}
        password: ${{ secrets.CONTABO_PASSWORD }}
        # আপনি যদি পাসওয়ার্ডের বদলে SSH Key ব্যবহার করেন, তবে নিচের লাইনটি আনকমেন্ট করুন
        # key: ${{ secrets.CONTABO_SSH_KEY }}
        port: 22
        source: "."                     # আপনার রিপোজিটরির কোন ফাইলগুলো যাবে (এখানে সব ফাইল)
        target: "/home/rightslash-tour/htdocs/tour.rightslash.com/"     # কন্টাবো সার্ভারের যে ফোল্ডারে ফাইলগুলো রাখতে চান (Path)
        strip_components: 0
