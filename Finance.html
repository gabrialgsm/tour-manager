<section class="card"><div class="sectionHead"><div><small>FINANCIAL CONTROL</small><h2>Tour Finance</h2></div><button class="primary" onclick="financeRefresh()">↻ Refresh</button></div><div id="financeStats" class="stats"></div><div class="grid"><div><h3>Expense Summary</h3><div id="expenseSummary"></div></div><div><h3>Payment Summary</h3><div id="paymentSummary"></div></div></div></section>
<script>
function financeRefresh(){if(!DATA)return;const p=DATA.passengers||[],x=DATA.expenses||[];const collection=p.reduce((n,a)=>n+Number(a.Paid||0),0),due=p.reduce((n,a)=>n+Number(a.Due||0),0),expense=x.reduce((n,a)=>n+Number(a.Amount||0),0);const gross=p.reduce((n,a)=>n+Number(a.TotalFee||0),0);document.getElementById('financeStats').innerHTML=[['Gross Bookings',money(gross)],['Collected',money(collection)],['Outstanding',money(due)],['Expenses',money(expense)],['Net Cash',money(collection-expense)],['Passengers',p.length],['Paid',p.filter(a=>Number(a.Due)<=0).length],['Pending',p.filter(a=>Number(a.Due)>0).length]].map(a=>`<div class="stat"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');const cats={};x.forEach(a=>cats[a.Category]=(cats[a.Category]||0)+Number(a.Amount||0));document.getElementById('expenseSummary').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(a=>`<div class="item"><span>${e(a[0])}</span><b>${money(a[1])}</b></div>`).join('')||'<p class="muted">No expenses.</p>';document.getElementById('paymentSummary').innerHTML=`<div class="item"><span>Total collected</span><b>${money(collection)}</b></div><div class="item"><span>Total due</span><b>${money(due)}</b></div><div class="item"><span>Collection rate</span><b>${gross?Math.round(collection/gross*100):0}%</b></div>`;}
</script>
