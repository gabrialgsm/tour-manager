<section class="card roomCard">
  <div class="sectionHead">
    <div><small>ROOM MANAGEMENT</small><h2>Room Allocation</h2></div>
    <button class="primary" onclick="openAddRoom()">+ Add Room</button>
  </div>
  <div id="roomSummary" class="roomSummary"></div>
  <div id="roomList"></div>
</section>
<script>
const ROOM_LABELS_UI={AC_COUPLE:'AC Couple',NON_AC_COUPLE:'Non-AC Couple',AC_4_BED:'AC 4 Bed',NON_AC_4_BED:'Non-AC 4 Bed'};
function renderRooms(){if(!DATA)return;const rooms=DATA.rooms||[];const counts={};Object.keys(ROOM_LABELS_UI).forEach(k=>counts[k]={rooms:0,used:0,cap:0});rooms.forEach(r=>{if(!counts[r.RoomType])counts[r.RoomType]={rooms:0,used:0,cap:0};counts[r.RoomType].rooms++;counts[r.RoomType].cap+=Number(r.Capacity||0);counts[r.RoomType].used=(r.PassengerIDs||'').split(',').filter(Boolean).length;});document.getElementById('roomSummary').innerHTML=Object.entries(ROOM_LABELS_UI).map(([k,v])=>`<div class="roomStat"><span>${v}</span><b>${counts[k].rooms} rooms</b><small>${counts[k].used}/${counts[k].cap} occupied</small></div>`).join('');document.getElementById('roomList').innerHTML=rooms.length?`<div class="roomGrid">${rooms.map(r=>{const used=(r.PassengerIDs||'').split(',').filter(Boolean).length;const cap=Number(r.Capacity||0);return `<div class="roomBox"><div><b>${e(r.RoomNo)}</b><div class="muted">${e(ROOM_LABELS_UI[r.RoomType]||r.RoomType)}</div></div><div class="roomOccupancy"><b>${used}/${cap}</b><span class="${used>=cap?'fullRoom':'openRoom'}">${used>=cap?'FULL':'AVAILABLE'}</span></div><button class="primary" onclick="assignRoomUI('${e(r.RoomID)}')">Assign</button></div>`}).join('')}</div>`:'<p class="muted">No rooms added yet.</p>';}
function openAddRoom(){document.getElementById('modalTitle').textContent='Add Room';document.getElementById('modalBody').innerHTML=`<form onsubmit="saveRoom(event)"><div class="formGrid">${f('Room Number','RoomNo','',1)}<div class="field"><label>Room Category</label><select name="RoomType">${Object.entries(ROOM_LABELS_UI).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>${f('Note','Note','',0,1)}</div><div class="actions"><button type="button" class="primary danger" onclick="closeModal()">Cancel</button><button class="primary">Save Room</button></div></form>`;document.getElementById('modal').classList.remove('hidden');}
function saveRoom(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));google.script.run.withSuccessHandler(x=>{DATA=x;closeModal();render();renderRooms();}).withFailureHandler(err=>alert(err.message||err)).addRoom(d);}
function assignRoomUI(roomId){const room=DATA.rooms.find(r=>r.RoomID===roomId);if(!room)return;const used=(room.PassengerIDs||'').split(',').filter(Boolean);const available=DATA.passengers.filter(p=>p.RoomType===room.RoomType&&!used.includes(p.PassengerID));if(!available.length){alert('No matching unassigned passengers for this room.');return;}document.getElementById('modalTitle').textContent='Assign '+room.RoomNo;document.getElementById('modalBody').innerHTML=`<form onsubmit="saveRoomAssignment(event,'${e(roomId)}')"><div class="field"><label>Passenger</label><select name="PassengerID">${available.map(p=>`<option value="${e(p.PassengerID)}">${e(p.Name)} · ${e(p.SeatNo)}</option>`).join('')}</select></div><div class="actions"><button type="button" class="primary danger" onclick="closeModal()">Cancel</button><button class="primary">Assign</button></div></form>`;document.getElementById('modal').classList.remove('hidden');}
function saveRoomAssignment(ev,roomId){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));google.script.run.withSuccessHandler(x=>{DATA=x;closeModal();render();renderRooms();}).withFailureHandler(err=>alert(err.message||err)).assignPassengerToRoom(roomId,d.PassengerID);}
</script>
