<script>
function paymentModal(passengerId){
  const p=DATA.passengers.find(x=>x.PassengerID===passengerId);
  if(!p)return;
  const due=Number(p.Due||0);
  if(due<=0){alert('This passenger has no due payment.');return;}
  document.getElementById('modalTitle').textContent='Payment · '+p.Name;
  document.getElementById('modalBody').innerHTML=`
    <div class="item"><div><b>${e(p.BusID)} · ${e(p.SeatNo)}</b><div class="muted">Total: ${money(p.TotalFee)} · Paid: ${money(p.Paid)}</div></div><span class="badge due">Due ${money(due)}</span></div>
    <form onsubmit="savePayment(event)">
      <input type="hidden" name="PassengerID" value="${e(passengerId)}">
      <div class="formGrid">
        ${f('Payment Amount','Amount','',1)}
        <div class="field"><label>Method</label><select name="Method"><option>Cash</option><option>Bank</option><option>bKash</option><option>Nagad</option><option>Rocket</option></select></div>
        ${f('Received By','ReceivedBy','')}
        ${f('Note','Note','',0,1)}
      </div>
      <div class="actions"><button type="button" class="primary danger" onclick="closeModal()">Cancel</button><button class="primary">Save Payment</button></div>
    </form>
    <hr><h3 style="font-size:15px">Payment History</h3><div id="paymentHistory">Loading…</div>`;
  document.getElementById('modal').classList.remove('hidden');
  google.script.run.withSuccessHandler(list=>{
    document.getElementById('paymentHistory').innerHTML=list.length?list.slice().reverse().map(x=>`<div class="item"><div><b>${money(x.Amount)}</b><div class="muted">${e(x.Method)} · ${e(x.ReceivedBy||'')} · ${e(x.Note||'')}</div></div><span class="muted">${formatPaymentDate(x.Date)}</span></div>`).join(''):'<div class="muted">No payment history.</div>';
  }).getPaymentHistory(passengerId);
}
function savePayment(ev){
  ev.preventDefault();
  const d=Object.fromEntries(new FormData(ev.target));
  d.Amount=Number(d.Amount||0);
  google.script.run.withSuccessHandler(x=>{DATA=x;closeModal();render();}).withFailureHandler(err=>alert(err.message||err)).addPayment(d);
}
function formatPaymentDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('en-GB');}
</script>
