<script>
let DATA=null;let AUTH_TOKEN=localStorage.getItem('gmjs_admin_token')||'';
function initAuth(){if(AUTH_TOKEN){callServer('getAppData',[AUTH_TOKEN],d=>{showApp();DATA=d;render();if(typeof renderPayments==='function')renderPayments();if(typeof renderRooms==='function')renderRooms();if(typeof financeRefresh==='function')financeRefresh()},()=>{AUTH_TOKEN='';localStorage.removeItem('gmjs_admin_token');showLogin()})}else showLogin()}
function showLogin(){document.getElementById('authScreen').classList.remove('hidden');document.getElementById('appShell').classList.add('hidden');setTimeout(()=>document.getElementById('pinInput')?.focus(),50)}
function showApp(){document.getElementById('authScreen').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden')}
function login(ev){ev.preventDefault();const pin=document.getElementById('pinInput').value;const err=document.getElementById('loginError');err.textContent='Checking…';callServer('adminLogin',[pin],r=>{AUTH_TOKEN=r.token;localStorage.setItem('gmjs_admin_token',AUTH_TOKEN);document.getElementById('pinInput').value='';err.textContent='';showApp();load()},e=>{err.textContent=e.message||String(e)})}
function doLogout(){callServer('logout',[AUTH_TOKEN],()=>{AUTH_TOKEN='';DATA=null;localStorage.removeItem('gmjs_admin_token');showLogin()},()=>{AUTH_TOKEN='';DATA=null;localStorage.removeItem('gmjs_admin_token');showLogin()})}
function callServer(fn,args,onSuccess,onFailure){let r=google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure||function(e){alert(e.message||e)});try{r[fn](...args)}catch(e){(onFailure||function(x){alert(x.message||x)})(e)}}
function load(){document.getElementById('tourTitle').textContent='Loading…';callServer('getAppData',[AUTH_TOKEN],d=>{DATA=d;render();if(typeof renderPayments==='function')renderPayments();if(typeof renderRooms==='function')renderRooms();if(typeof financeRefresh==='function')financeRefresh()},e=>{const msg=e&&e.message?e.message:String(e);document.getElementById('tourTitle').textContent='Load failed';alert('GMJS data load failed:\n\n'+msg)})}
const ROOM_LABELS={AC_COUPLE:'AC Couple',NON_AC_COUPLE:'Non-AC Couple',AC_4_BED:'AC 4 Bed',NON_AC_4_BED:'Non-AC 4 Bed'};
function render(){if(!DATA||!DATA.tour){document.getElementById('tourTitle').textContent='No active tour';return;}document.getElementById('tourTitle').textContent=DATA.tour.TourName;document.getElementById('tourDates').textContent=DATA.tour.StartDate+' → '+DATA.tour.EndDate;renderStats();const s=document.getElementById('busSelect');s.innerHTML=DATA.buses.map((b,i)=>`<option value="${b.BusID}" ${i?'':'selected'}>${b.BusName} · ${b.SeatCount} seats</option>`).join('');renderBus();renderPassengers();renderDue();renderExpenses();if(typeof renderRooms==='function')renderRooms();if(typeof renderPayments==='function')renderPayments();if(typeof financeRefresh==='function')financeRefresh()}
function renderStats(){const s=DATA.summary;document.getElementById('stats').innerHTML=[['Booked',s.booked+'/'+s.totalSeats],['Available',s.available],['Collection',money(s.collection)],['Due',money(s.due)],['Expense',money(s.expense)],['Balance',money(s.balance)],['Paid',s.paidCount],['Pending',s.dueCount]].map(a=>`<div class="stat"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}
function renderBus(){const b=DATA.buses.find(x=>x.BusID===document.getElementById('busSelect').value);if(!b)return;const rows={};b.Seats.forEach(s=>(rows[s.RowNo]??=[]).push(s));let html='<div class="driver">DRIVER</div>';Object.keys(rows).sort().forEach(r=>{const a=rows[r].sort((x,y)=>Number(x.ColNo)-Number(y.ColNo));[1,2].forEach(c=>{const s=a.find(x=>Number(x.ColNo)===c);html+=s?seat(s):'<div class="aisle"></div>'});html+='<div class="aisle"></div>';[3,4,5].forEach(c=>{const s=a.find(x=>Number(x.ColNo)===c);html+=s?seat(s):'<div class="aisle"></div>'})});document.getElementById('seatMap').innerHTML=html}
function seat(s){let cls=s.Status==='BOOKED'?'booked':'';const p=DATA.passengers.find(x=>x.PassengerID===s.PassengerID);if(p&&Number(p.Due)>0)cls='due';return `<button class="seat ${cls}" onclick="openSeat('${e(s.BusID)}','${e(s.SeatNo)}')">${e(s.SeatNo)}</button>`}
function openSeat(bus,seat){const p=DATA.passengers.find(x=>x.BusID===bus&&x.SeatNo===seat);document.getElementById('modalTitle').textContent=p?'Edit '+seat:'Book '+seat;document.getElementById('modalBody').innerHTML=form(bus,seat,p||{});document.getElementById('modal').classList.remove('hidden')}
function form(bus,seat,p){const total=p.TotalFee??DATA.tour.PackageFee;const room=p.RoomType||'AC_4_BED';const discount=p.Discount||0;const paid=p.Paid??DATA.tour.BookingFee;return `<form onsubmit="save(event)"><input type="hidden" name="PassengerID" value="${e(p.PassengerID)}"><input type="hidden" name="BusID" value="${e(bus)}"><input type="hidden" name="SeatNo" value="${e(seat)}"><div class="formGrid">${f('Name','Name',p.Name||'',1)}${f('Phone','Phone',p.Phone||'',1)}${f('Address','Address',p.Address||'',0,1)}${f('Blood Group','BloodGroup',p.BloodGroup||'')}${f('Emergency Contact','EmergencyContact',p.EmergencyContact||'')}${f('Departure','Departure',p.Departure||'Dhapari')}<div class="field full"><label>Room Category</label><select name="RoomType">${Object.entries(ROOM_LABELS).map(([v,l])=>`<option value="${v}" ${room===v?'selected':''}>${l}</option>`).join('')}</select></div>${f('Final Tour Fee','TotalFee',total,1)}${f('Discount / Assistance','Discount',discount)}${f('Paid Now','Paid',paid)}<div class="field"><label>Estimated Due</label><input id="liveDue" value="${Math.max(Number(total)-Number(discount)-Number(paid),0)}" readonly></div>${f('Notes','Notes',p.Notes||'',0,1)}</div><div class="actions">${p.PassengerID?`<button type="button" class="primary" onclick="paymentModal('${e(p.PassengerID)}')">+ Payment</button>`:''}<button type="button" class="primary danger" onclick="closeModal()">Cancel</button><button class="primary">${p.PassengerID?'Update':'Save Booking'}</button></div></form>`}
function f(label,name,value,req,full){return `<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" ${['TotalFee','Discount','Paid','Amount'].includes(name)?'type="number" min="0" step="1"':''} value="${e(value)}" ${req?'required':''}></div>`}
function save(ev){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target));o.Discount=Number(o.Discount||0);o.TotalFee=Number(o.TotalFee||0);o.Paid=Number(o.Paid||0);if(o.Discount>o.TotalFee){alert('Discount cannot exceed tour fee.');return}if(o.Paid>o.TotalFee-o.Discount){alert('Paid amount cannot exceed final fee.');return}o.TotalFee=o.TotalFee-o.Discount;callServer('bookPassenger',[o,AUTH_TOKEN],d=>{DATA=d;closeModal();render()},e=>alert(e.message||e))}
document.addEventListener('input',ev=>{if(['TotalFee','Discount','Paid'].includes(ev.target.name)){const form=ev.target.form;if(form){const t=Number(form.TotalFee?.value||0)-Number(form.Discount?.value||0);const p=Number(form.Paid?.value||0);const due=form.querySelector('#liveDue');if(due)due.value=Math.max(t-p,0)}}});
function renderPassengers(){const q=(document.getElementById('search').value||'').toLowerCase();const a=DATA.passengers.filter(p=>[p.Name,p.Phone,p.SeatNo,p.BusID].join(' ').toLowerCase().includes(q));document.getElementById('passengers').innerHTML=a.length?`<table class="table"><thead><tr><th>Seat</th><th>Name</th><th>Phone</th><th>Room</th><th>Fee</th><th>Paid</th><th>Due</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td>${e(p.SeatNo)}</td><td>${e(p.Name)}</td><td>${e(p.Phone)}</td><td>${e(ROOM_LABELS[p.RoomType]||p.RoomType||'')}</td><td>${money(p.TotalFee)}</td><td>${money(p.Paid)}</td><td>${p.Due>0?money(p.Due):'Paid'}</td><td><button class="primary" onclick="openSeat('${e(p.BusID)}','${e(p.SeatNo)}')">Edit</button>${p.Due>0?` <button class="primary" onclick="paymentModal('${e(p.PassengerID)}')">Pay</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<p>No passengers.</p>'}
function renderDue(){const a=DATA.passengers.filter(p=>Number(p.Due)>0);document.getElementById('dueList').innerHTML=a.map(p=>`<div class="item"><div><b>${e(p.Name)}</b><div class="muted">${e(p.BusID)} · ${e(p.SeatNo)} · ${e(p.Phone)}</div></div><div><span class="badge due">${money(p.Due)}</span> <button class="primary" onclick="paymentModal('${e(p.PassengerID)}')">+ Payment</button></div></div>`).join('')||'<div class="muted">No pending payments.</div>'}
function renderExpenses(){document.getElementById('expenses').innerHTML=DATA.expenses.slice(-10).reverse().map(x=>`<div class="item"><div><b>${e(x.Category)}</b><div class="muted">${e(x.Description||'')} · ${e(x.PaidBy||'')}</div></div><b>${money(x.Amount)}</b></div>`).join('')||'<div class="muted">No expenses.</div>'}
function expenseModal(){document.getElementById('modalTitle').textContent='Add Expense';document.getElementById('modalBody').innerHTML=`<form onsubmit="saveExpense(event)"><div class="formGrid">${f('Category','Category','',1)}${f('Amount','Amount','',1)}${f('Description','Description','',0,1)}${f('Paid By','PaidBy','')}${f('Note','Note','',0,1)}</div><div class="actions"><button type="button" class="primary danger" onclick="closeModal()">Cancel</button><button class="primary">Save Expense</button></div></form>`;document.getElementById('modal').classList.remove('hidden')}
function saveExpense(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));d.Amount=Number(d.Amount);callServer('addExpense',[d,AUTH_TOKEN],x=>{DATA=x;closeModal();render()},e=>alert(e.message||e))}
function closeModal(){document.getElementById('modal').classList.add('hidden')}function seatPage(){document.querySelector('.seatMap').scrollIntoView({behavior:'smooth'})}function topPage(){scrollTo({top:0,behavior:'smooth'})}function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}function e(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script>
