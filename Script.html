<script>
let DATA=null;
function load(){google.script.run.withSuccessHandler(d=>{DATA=d;render();}).withFailureHandler(e=>alert(e.message||e)).getAppData();}
function render(){if(!DATA||!DATA.tour)return;document.getElementById('tourTitle').textContent=DATA.tour.TourName;document.getElementById('tourDates').textContent=DATA.tour.StartDate+' → '+DATA.tour.EndDate;renderStats();const s=document.getElementById('busSelect');s.innerHTML=DATA.buses.map((b,i)=>`<option value="${b.BusID}" ${i?'':'selected'}>${b.BusName}</option>`).join('');renderBus();renderPassengers();renderDue();renderExpenses();}
function renderStats(){const s=DATA.summary;const x=[['Booked',s.booked+'/'+s.totalSeats],['Available',s.available],['Collection',money(s.collection)],['Due',money(s.due)],['Expense',money(s.expense)],['Balance',money(s.balance)],['Paid',s.paidCount],['Pending',s.dueCount]];document.getElementById('stats').innerHTML=x.map(a=>`<div class="stat"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');}
function renderBus(){const b=DATA.buses.find(x=>x.BusID===document.getElementById('busSelect').value);if(!b)return;const rows={};b.Seats.forEach(s=>(rows[s.RowNo]??=[]).push(s));let html='';Object.keys(rows).forEach(r=>{const a=rows[r].sort((x,y)=>Number(x.ColNo)-Number(y.ColNo));if(r==='K'){a.forEach(s=>html+=seat(s,true));}else{[1,2].forEach(c=>{const s=a.find(x=>Number(x.ColNo)===c);html+=s?seat(s):'<div class="aisle"></div>'});html+='<div class="aisle"></div>';[4,5,6].forEach(c=>{const s=a.find(x=>Number(x.ColNo)===c);html+=s?seat(s):'<div class="aisle"></div>'})}});document.getElementById('seatMap').innerHTML=html;}
function seat(s,rear){let cls=s.Status==='BOOKED'?'booked':'';const p=DATA.passengers.find(x=>x.PassengerID===s.PassengerID);if(p&&Number(p.Due)>0)cls='due';return `<button class="seat ${cls} ${rear?'rear':''}" onclick="openSeat('${s.BusID}','${s.SeatNo}')">${s.SeatNo}</button>`;}
function openSeat(bus,seat){const p=DATA.passengers.find(x=>x.BusID===bus&&x.SeatNo===seat);document.getElementById('modalTitle').textContent=p?'Edit '+seat:'Book '+seat;document.getElementById('modalBody').innerHTML=form(bus,seat,p||{});document.getElementById('modal').classList.remove('hidden');}
function form(bus,seat,p){const total=p.TotalFee||DATA.tour.PackageFee;return `<form onsubmit="save(event)"><input type="hidden" name="PassengerID" value="${e(p.PassengerID)}"><input type="hidden" name="BusID" value="${e(bus)}"><input type="hidden" name="SeatNo" value="${e(seat)}"><div class="formGrid">${f('Name','Name',p.Name||'',1)}${f('Phone','Phone',p.Phone||'',1)}${f('Address','Address',p.Address||'',0,1)}${f('Blood Group','BloodGroup',p.BloodGroup||'')} ${f('Emergency Contact','EmergencyContact',p.EmergencyContact||'')} ${f('Departure','Departure',p.Departure||'Dhapari')}<div class="field"><label>Room Type</label><select name="RoomType"><option value="SHARED">Shared AC</option><option value="COUPLE" ${p.RoomType==='COUPLE'?'selected':''}>Couple AC</option></select></div><div class="field"><label>Package</label><select name="PackageType"><option value="STANDARD">Standard</option><option value="COUPLE" ${p.PackageType==='COUPLE'?'selected':''}>Couple</option></select></div>${f('Total Fee','TotalFee',total)}${f('Paid','Paid',p.Paid||DATA.tour.BookingFee)}${f('Notes','Notes',p.Notes||'',0,1)}</div><div class="actions"><button type="button" class="primary danger" onclick="closeModal()">Cancel</button><button class="primary">Save Booking</button></div></form>`}
function f(label,name,value,req,full){return `<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" value="${e(value)}" ${req?'required':''}></div>`}
function save(ev){ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target));o.TotalFee=Number(o.TotalFee||0);o.Paid=Number(o.Paid||0);google.script.run.withSuccessHandler(d=>{DATA=d;closeModal();render();}).withFailureHandler(err=>alert(err.message||err)).bookPassenger(o);}
function renderPassengers(){const q=(document.getElementById('search').value||'').toLowerCase();const a=DATA.passengers.filter(p=>[p.Name,p.Phone,p.SeatNo,p.BusID].join(' ').toLowerCase().includes(q));document.getElementById('passengers').innerHTML=`<table class="table"><thead><tr><th>Seat</th><th>Name</th><th>Phone</th><th>Paid</th><th>Due</th><th></th></tr></thead><tbody>${a.map(p=>`<tr><td>${e(p.SeatNo)}</td><td>${e(p.Name)}</td><td>${e(p.Phone)}</td><td>${money(p.Paid)}</td><td>${p.Due>0?money(p.Due):'Paid'}</td><td><button class="primary" onclick="openSeat('${e(p.BusID)}','${e(p.SeatNo)}')">Edit</button></td></tr>`).join('')}</tbody></table>`||'<p>No passengers.</p>';}
function renderDue(){const a=DATA.passengers.filter(p=>Number(p.Due)>0);document.getElementById('dueList').innerHTML=a.map(p=>`<div class="item"><div><b>${e(p.Name)}</b><div class="muted">${e(p.BusID)} · ${e(p.SeatNo)} · ${e(p.Phone)}</div></div><span class="badge due">${money(p.Due)}</span></div>`).join('')||'<div class="muted">No pending payments.</div>';}
function renderExpenses(){document.getElementById('expenses').innerHTML=DATA.expenses.slice(-10).reverse().map(x=>`<div class="item"><div><b>${e(x.Category)}</b><div class="muted">${e(x.Description||'')} · ${e(x.PaidBy||'')}</div></div><b>${money(x.Amount)}</b></div>`).join('')||'<div class="muted">No expenses.</div>';}
function expenseModal(){document.getElementById('modalTitle').textContent='Add Expense';document.getElementById('modalBody').innerHTML=`<form onsubmit="saveExpense(event)"><div class="formGrid">${f('Category','Category','',1)}${f('Amount','Amount','',1)}${f('Description','Description','',0,1)}${f('Paid By','PaidBy','')}${f('Note','Note','',0,1)}</div><div class="actions"><button type="button" class="primary danger" onclick="closeModal()">Cancel</button><button class="primary">Save Expense</button></div></form>`;document.getElementById('modal').classList.remove('hidden');}
function saveExpense(ev){ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));d.Amount=Number(d.Amount);google.script.run.withSuccessHandler(x=>{DATA=x;closeModal();render();}).withFailureHandler(err=>alert(err.message||err)).addExpense(d);}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function seatPage(){document.querySelector('.card').scrollIntoView({behavior:'smooth'})}function topPage(){scrollTo({top:0,behavior:'smooth'})}
function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}function e(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script>
